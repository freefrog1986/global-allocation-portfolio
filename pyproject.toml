[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "global-allocation-portfolio"
version = "0.1.0"
description = "Global asset allocation portfolio — strategy templates, historical data, backtesting, and Feishu chart card reports."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["asset-allocation", "portfolio", "backtest", "quant", "feishu", "lark"]
authors = [
    { name = "liubo", email = "liubo22@users.noreply.github.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

# Runtime dependencies — pinned to ranges known to coexist as of 2026-09.
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "yfinance>=0.2.40,<0.3",
    "akshare>=1.13,<2",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "typer>=0.12,<0.14",
    "rich>=13.7,<14",
    "lark-oapi>=1.2,<2",
]

# Optional dependency: vectorbt is heavy and only required for the backtest engine.
[project.optional-dependencies]
backtest = ["vectorbt>=0.26,<0.30"]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<6",
    "pytest-mock>=3.14,<4",
    "ruff>=0.5,<0.7",
    "mypy>=1.10,<2",
    "types-PyYAML",
]

[project.scripts]
gap = "global_allocation.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["global_allocation*"]

[tool.setuptools.package-data]
global_allocation = ["py.typed"]

# ─── Tooling config ──────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "dist", "build"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle + pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "N",            # pep8-naming
]
ignore = ["E501"]  # line-length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "akshare.*", "vectorbt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=src/global_allocation --cov-report=term-missing --cov-fail-under=80"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that hit the network",
]
filterwarnings = [
    "ignore::DeprecationWarning:yfinance.*",
    "ignore::DeprecationWarning:akshare.*",
]
